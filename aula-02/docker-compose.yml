services:

  # API Node.js da aplicação
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: technova-api
    restart: unless-stopped
    ports:
      - "${PORT}:3000"
    environment:
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - technova-network

  # Banco de dados PostgreSQL com persistência
  postgres:
    image: postgres:15-alpine
    container_name: technova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - technova-network

  # Redis utilizado como cache
  redis:
    image: redis:7-alpine
    container_name: technova-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - technova-network

# Volume nomeado para manter os dados do PostgreSQL
volumes:
  postgres-data:

# Rede bridge personalizada compartilhada pelos três serviços
networks:
  technova-network:
    driver: bridge